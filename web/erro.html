<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Modelo das páginas de erro do servidor Python (429, 503, 500) em endereços de página; a API responde em JSON.
     Os marcadores entre chaves duplas (código, título, mensagem) são preenchidos em adaptadores/http/servidor.py. -->
<title>{{titulo}} · Medalhas</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070a14">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="min-h-screen overflow-x-clip antialiased">
<div class="aurora"></div><div class="grid-bg"></div>

<header class="border-b hairline bg-ink-900/70">
  <div class="mx-auto flex max-w-7xl items-center px-4 py-3 sm:px-6">
    <a href="/" class="group flex items-center gap-2.5 whitespace-nowrap">
      <img src="/favicon.svg" alt="" width="40" height="40" class="h-10 w-10 flex-none drop-shadow-[0_4px_12px_rgba(245,197,66,.35)] transition-transform group-hover:-rotate-6">
      <span class="leading-tight">
        <span class="font-display block text-lg font-bold text-shine">Medalhas</span>
        <span class="block text-[10px] font-semibold uppercase tracking-[.2em] text-slate-500">Olimpíadas · Brasil</span>
      </span>
    </a>
  </div>
</header>

<main class="mx-auto max-w-xl px-4 pb-24 pt-16 sm:px-6">
  <div class="glass card p-8 text-center sm:p-10">
    <p class="font-display text-6xl font-bold text-gold-grad">{{codigo}}</p>
    <h1 class="font-display mt-3 text-2xl font-bold">{{titulo}}</h1>
    <p class="mt-2 text-slate-400">{{mensagem}}</p>
    <div class="mt-6"><a href="" class="btn btn-gold justify-center !px-5">Tentar de novo</a></div>

    <nav class="mt-6 flex flex-wrap justify-center gap-2 text-sm">
      <a href="/" class="btn">Página inicial</a>
      <a href="/ranking/alunos" class="btn">Ranking de alunos</a>
      <a href="/ranking/escolas" class="btn">Ranking de escolas</a>
      <a href="/estados" class="btn">Mapa do Brasil</a>
    </nav>
    <p class="mt-6 text-xs text-slate-500">O problema continua? Avise em
      <a class="link" href="mailto:pedro.vasconcelosneves@gmail.com?subject=Medalhas%3A%20erro%20no%20site">pedro.vasconcelosneves@gmail.com</a>.</p>
  </div>
</main>
</body>
</html>
